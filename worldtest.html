<script>
(() => {

"use strict";


const CHUNK_SIZE = 32;

const MIN_CHUNK_Y = -3;
const MAX_CHUNK_Y = 3;


const canvas =
  document.getElementById(
    "map"
  );


const ctx =

const statusEl =

  );


const zEl =

const radiusEl =

let bmd = null;
let imd = null;
let workerFunction = null;

let worker = null;
let workerSeed = null;


const chunks =
  new Map();


const pending =
  new Map();


const blockNames =
  new Map();


const blockTexts =
  new Map();


let lastSurface =
  null;


let lastView =
  null;


// =====================================================
// HELPERS
// =====================================================

function floorDiv(
  value,
  divisor
){

  return Math.floor(
    value /
    divisor
  );
}


function mod(
  value,
  divisor
){

  return (
    (
      value %
      divisor
    )
    +
    divisor
  )
  %
  divisor;
}


function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );
}


function normalSeed(
  value
){

  const text =
    String(
      value
    )
    .trim();


  if (
    /^-?\d+$/.test(
      text
    )
  ){

    const number =
      Number(
        text
      );


    if (
      Number.isSafeInteger(
        number
      )
    ){

      return number;
    }
  }


  return text;
}


function chunkKey(
  seed,
  cx,
  cy,
  cz
){

  return (
    seed
    +
    "|"
    +
    cx
    +
    "|"
    +
    cy
    +
    "|"
    +
    cz
  );
}


// =====================================================
// LOAD FILES
// =====================================================

async function loadText(
  file
){

  const response =
    await fetch(
      "./" +
      file,
      {
        cache:
          "no-store"
      }
    );


  if (
    !response.ok
  ){

    throw new Error(
      file +
      " HTTP " +
      response.status
    );
  }


  return await response.text();
}


function extractVariable(
  source,
  variable
){

  return new Function(

    source
    +
    `

    return typeof ${variable} !== "undefined"
      ? ${variable}
      : window[${JSON.stringify(variable)}];

    `
  )();
}


// =====================================================
// BLOCK METADATA
// =====================================================

function buildBlockIndex(){

  blockNames.clear();
  blockTexts.clear();


  for (
    const [
      name,
      entry
    ]
    of
    Object.entries(
      bmd ||
      {}
    )
  ){

    const id =
      Number(
        entry?.id
      );


    if (
      !Number.isFinite(
        id
      )
    ){

      continue;
    }


    blockNames.set(
      id,
      name
    );


    blockTexts.set(

      id,

      (
        name
        +
        " "
        +
        (
          entry?.displayName
          ||
          ""
        )
        +
        " "
        +
        (
          entry?.meta?.rootName
          ||
          ""
        )
      )
      .toLowerCase()
    );
  }
}


function blockText(
  id
){

  return (
    blockTexts.get(
      Number(
        id
      )
    )
    ||
    ""
  );
}


function blockName(
  id
){

  return (
    blockNames.get(
      Number(
        id
      )
    )
    ||
    "Block " +
    id
  );
}


function isAir(
  id
){

  return (
    Number(
      id
    )
    ===
    0

    ||

    blockText(
      id
    )
    .includes(
      "air"
    )
  );
}


// =====================================================
// BLOCK COLORS
// =====================================================

function baseColor(
  id
){

  const t =
    blockText(
      id
    );


  if (
    t.includes(
      "water"
    )
  ){

    return [
      47,

    ];
  }


  if (
    t.includes(
      "lava"
    )
  ){

    return [
      240,
      88,
      23
    ];
  }


  if (
    t.includes(
      "snow"
    )
  ){

    return [
      235,
      240,
      244
    ];
  }


  if (
    t.includes(
      "ice"
    )
  ){

    return [
      171,
      221,
      235
    ];
  }


  if (
    t.includes(
      "sand"
    )
  ){

    return [
      217,
      199,
      127
    ];
  }


  if (
    t.includes(
      "gravel"
    )
  ){

    return [
      120,
      119,
      116
    ];
  }


  if (
    t.includes(
      "clay"
    )
  ){

    return [
      167,
      121,
      103
    ];
  }


  if (
    t.includes(
      "cactus"
    )
  ){

    return [
      48,
      116,
      50
    ];
  }


  if (
    t.includes(
      "leaf"
    )

    ||

    t.includes(
      "leaves"
    )
  ){

    return [
      77,
      143,
      54
    ];
  }


  if (
    t.includes(
      "wood"
    )

    ||

    t.includes(
      "log"
    )

    ||

    t.includes(
      "plank"
    )
  ){

    return [
      139,
      101,
      65
    ];
  }


  if (
    t.includes(
      "flower"
    )

    ||

    t.includes(
      "rose"
    )

    ||

    t.includes(
      "poppy"
    )

    ||

    t.includes(
      "tulip"
    )
  ){

    return [
      220,
      72,
      118
    ];
  }


  if (
    t.includes(
      "grass"
    )
  ){

    return [
      90,
      162,
      58
    ];
  }


  if (
    t.includes(
      "dirt"
    )

    ||

    t.includes(
      "mud"
    )
  ){

    return [
      139,
      104,
      71
    ];
  }


  if (
    t.includes(
      "stone"
    )

    ||

    t.includes(
      "rock"
    )
  ){

    return [
      133,
      139,
      146
    ];
  }


  if (
    t.includes(
      "coal"
    )
  ){

    return [
      43,
      46,
      50
    ];
  }


  if (
    t.includes(
      "iron"
    )
  ){

    return [
      206,
      198,
      184
    ];
  }


  if (
    t.includes(
      "gold"
    )
  ){

    return [
      232,
      190,
      53
    ];
  }


  if (
    t.includes(
      "diamond"
    )
  ){

    return [
      50,
      160,
      224
    ];
  }


  if (
    t.includes(
      "moonstone"
    )
  ){

    return [
      214,
      68,
      118
    ];
  }


  let hash =
    Number(
      id
    )
    >>>
    0;


  hash =
    (
      hash *
      2654435761
    )
    >>>
    0;


  return [

    82 +
    (
      hash &
      47
    ),

    82 +
    (
      (
        hash >>
        6
      )
      &
      47
    ),

    82 +
    (
      (
        hash >>
        12
      )
      &
      47
    )

  ];
}


function adjustColor(
  color,
  amount
){

  return [

    clamp(
      Math.round(
        color[0] +
        amount
      ),
      0,
      255
    ),

    clamp(
      Math.round(
        color[1] +
        amount
      ),
      0,
      255
    ),

    clamp(
      Math.round(
        color[2] +
        amount
      ),
      0,
      255
    )

  ];
}


function coordinateVariation(
  x,
  z,
  id
){

  let n =
    (
      x *
      374761393

      +

      z *
      668265263

      +

      Number(
        id
      )
      *
      2246822519
    )
    |
    0;


  n =
    (
      n ^
      (
        n >>>
        13
      )
    )
    *
    1274126177;


  n =
    n ^
    (
      n >>>
      16
    );


  return (
    (
      n &
      7
    )
    -
    3
  )
  *
  0.7;
}


// =====================================================
// WORKER
// =====================================================

function createWorker(){

  if (
    worker
  ){

    worker.terminate();
  }


  const blob =
    new Blob(

      [
        "("
        +
        workerFunction.toString()
        +
        ")()"
      ],

      {
        type:
          "application/javascript"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  worker =
    new Worker(
      url
    );


  workerSeed =
    null;


  worker.postMessage({

    type:
      "workerInit",

    chunkSize:
      32,

    itemMetadata:
      imd,

    blockMetadata:
      bmd

  });


  worker.onmessage =
    event => {

      const result =
        event.data;


      if (
        !result

        ||

        result.type !==
        "chunkResponse"
      ){

        return;
      }


      for (
        const [
          key,
          request
        ]
        of
        pending
      ){

        if (
          request.id !==
          result.id
        ){

          continue;
        }


        pending.delete(
          key
        );


        const raw =
          result.array?.data;


        const data =
          raw
          instanceof
          Uint16Array

          ?

          raw

          :

          new Uint16Array(
            raw?.buffer
            ||
            raw
            ||
            []
          );


        const chunk = {

          cx:
            request.cx,

          cy:
            request.cy,

          cz:
            request.cz,

          data

        };


        chunks.set(
          key,
          chunk
        );


        request.resolve(
          chunk
        );


        break;
      }
    };
}


function setWorkerSeed(
  seed
){

  if (
    String(
      workerSeed
    )
    ===
    String(
      seed
    )
  ){

    return;
  }


  worker.postMessage({

    type:
      "createSeed",

    seed,

    dN:
      1,

    oN:
      1

  });


  workerSeed =
    seed;
}


// =====================================================
// CHUNK REQUEST
// =====================================================

function requestChunk(
  seed,
  cx,
  cy,
  cz
){

  const key =
    chunkKey(
      seed,
      cx,
      cy,
      cz
    );


  if (
    chunks.has(
      key
    )
  ){

    return Promise.resolve(
      chunks.get(
        key
      )
    );
  }


  if (
    pending.has(
      key
    )
  ){

    return pending
      .get(
        key
      )
      .promise;
  }


  setWorkerSeed(
    seed
  );


  const id =
    (
      cx *
      32
    )
    +
    "|"
    +
    (
      cy *
      32
    )
    +
    "|"
    +
    (
      cz *
      32
    )
    +
    "|"
    +
    seed;


  let resolvePromise;


  const promise =
    new Promise(
      resolve => {

        resolvePromise =
          resolve;
      }
    );


  pending.set(

    key,

    {

      id,

      cx,
      cy,
      cz,

      resolve:
        resolvePromise,

      promise

    }
  );


  worker.postMessage({

    id,

    type:
      "chunk",

    array: {

      data:
        new Uint16Array(
          32768
        ),

      shape: [
        32,
        32,
        32
      ],

      stride: [
        1024,
        32,
        1
      ],

      offset:
        0

    }

  });


  return promise;
}


// =====================================================
// BLOCK LOOKUP
// =====================================================

function getBlock(
  seed,
  x,
  y,
  z
){

  const cx =
    floorDiv(
      x,
      CHUNK_SIZE
    );


  const cy =
    floorDiv(
      y,
      CHUNK_SIZE
    );


  const cz =
    floorDiv(
      z,
      CHUNK_SIZE
    );


  const chunk =
    chunks.get(

      chunkKey(
        seed,
        cx,
        cy,
        cz
      )
    );


  if (
    !chunk
  ){

    return null;
  }


  const lx =
    mod(
      x,
      CHUNK_SIZE
    );


  const ly =
    mod(
      y,
      CHUNK_SIZE
    );


  const lz =
    mod(
      z,
      CHUNK_SIZE
    );


  return chunk.data[

    lx *
    1024

    +

    ly *
    32

    +

    lz

  ];
}


// =====================================================
// SURFACE
// =====================================================

function findTopBlock(
  seed,
  x,
  z
){

  const maxY =
    MAX_CHUNK_Y *
    32
    +
    31;


  const minY =
    MIN_CHUNK_Y *
    32;


  for (
    let y = maxY;
    y >= minY;
    y--
  ){

    const id =
      getBlock(
        seed,
        x,
        y,
        z
      );


    if (
      id === null
    ){

      continue;
    }


    if (
      !isAir(
        id
      )
    ){

      return {
        id,
        y
      };
    }
  }


  return null;
}


function buildSurface(
  seed,
  centerX,
  centerZ,
  radius
){

  const size =
    radius *
    2
    +
    1;


  const surface =
    new Array(
      size
    );


  for (
    let row = 0;
    row < size;
    row++
  ){

    surface[row] =
      new Array(
        size
      );


    const worldZ =
      centerZ
      -
      radius
      +
      row;


    for (
      let col = 0;
      col < size;
      col++
    ){

      const worldX =
        centerX
        -
        radius
        +
        col;


      const top =
        findTopBlock(
          seed,
          worldX,
          worldZ
        );


      surface[row][col] =
        top

        ?

        {
          id:
            top.id,

          y:
            top.y,

          x:
            worldX,

          z:
            worldZ
        }

        :

        {
          id:
            0,

          y:
            MIN_CHUNK_Y *
            32,

          x:
            worldX,

          z:
            worldZ
        };
    }
  }


  return surface;
}


// =====================================================
// HEIGHT SHADING
// =====================================================

function heightAt(
  surface,
  row,
  col
){

  const r =
    clamp(
      row,
      0,
      surface.length - 1
    );


  const c =
    clamp(
      col,
      0,
      surface.length - 1
    );


  return surface[r][c].y;
}


// =====================================================
// RENDER
// =====================================================

function renderSurface(
  surface,
  centerX,
  centerZ,
  radius
){

  const size =
    surface.length;


  const temp =
    document.createElement(
      "canvas"
    );


  temp.width =
    size;

  temp.height =
    size;


  const tctx =
    temp.getContext(
      "2d",
      {
        alpha:false
      }
    );


  const image =
    tctx.createImageData(
      size,
      size
    );


  const pixels =
    image.data;


  const centerHeight =
    surface[radius]?.[radius]?.y
    ??
    0;


  for (
    let row = 0;
    row < size;
    row++
  ){

    for (
      let col = 0;
      col < size;
      col++
    ){

      const cell =
        surface[row][col];


      let c =
        baseColor(
          cell.id
        );


      const hL =
        heightAt(
          surface,
          row,
          col - 1
        );


      const hR =
        heightAt(
          surface,
          row,
          col + 1
        );


      const hU =
        heightAt(
          surface,
          row - 1,
          col
        );


      const hD =
        heightAt(
          surface,
          row + 1,
          col
        );


      // leichte Relief-Schattierung
      // Licht kommt von links oben
      const slopeShade =
        (
          (
            hL +
            hU
          )
          -
          (
            hR +
            hD
          )
        )
        *
        3.2;


      // höhere Bereiche minimal heller
      const altitudeShade =
        (
          cell.y
          -
          centerHeight
        )
        *
        0.22;


      // kleine Blockvariation
      const textureShade =
        coordinateVariation(
          cell.x,
          cell.z,
          cell.id
        );


      c =
        adjustColor(

          c,

          clamp(

            slopeShade
            +
            altitudeShade
            +
            textureShade,

            -24,

            24
          )
        );


      const i =
        (
          row *
          size
          +
          col
        )
        *
        4;


      pixels[i] =
        c[0];


      pixels[i + 1] =
        c[1];


      pixels[i + 2] =
        c[2];


      pixels[i + 3] =
        255;
    }
  }


  tctx.putImageData(
    image,
    0,
    0
  );


  ctx.imageSmoothingEnabled =
    false;


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(
    temp,
    0,
    0,
    canvas.width,
    canvas.height
  );


  drawGrid(
    centerX,
    centerZ,
    radius,
    size
  );


  drawCenterMarker();
}


// =====================================================
// BLOCK GRID + CHUNK LINES
// =====================================================

function drawGrid(
  centerX,
  centerZ,
  radius,
  size
){

  const cell =
    canvas.width /
    size;


  const blockAlpha =
    cell >= 5
    ?
    0.075
    :
    cell >= 3
    ?
    0.045
    :
    0.025;


  ctx.save();


  // -----------------------------
  // Block-Raster
  // -----------------------------

  ctx.lineWidth =
    1;


  ctx.strokeStyle =
    `rgba(255,255,255,${blockAlpha})`;


  for (
    let i = 0;
    i <= size;
    i++
  ){

    const p =
      Math.round(
        i *
        cell
      )
      +
      0.5;


    ctx.beginPath();

    ctx.moveTo(
      p,
      0
    );

    ctx.lineTo(
      p,
      canvas.height
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      0,
      p
    );

    ctx.lineTo(
      canvas.width,
      p
    );

    ctx.stroke();
  }


  // -----------------------------
  // Chunk-Linien
  // -----------------------------

  ctx.strokeStyle =
    "rgba(94,228,255,.48)";


  ctx.lineWidth =
    1.35;


  const minX =
    centerX
    -
    radius;


  const minZ =
    centerZ
    -
    radius;


  for (
    let col = 0;
    col <= size;
    col++
  ){

    const worldX =
      minX
      +
      col;


    if (
      mod(
        worldX,
        32
      )
      !==
      0
    ){

      continue;
    }


    const x =
      Math.round(
        col *
        cell
      )
      +
      0.5;


    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      canvas.height
    );

    ctx.stroke();
  }


  for (
    let row = 0;
    row <= size;
    row++
  ){

    const worldZ =
      minZ
      +
      row;


    if (
      mod(
        worldZ,
        32
      )
      !==
      0
    ){

      continue;
    }


    const y =
      Math.round(
        row *
        cell
      )
      +
      0.5;


    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      canvas.width,
      y
    );

    ctx.stroke();
  }


  // -----------------------------
  // Chunk-Koordinaten
  // -----------------------------

  if (
    cell >= 3.5
  ){

    ctx.font =
      "10px Consolas,monospace";


    ctx.textBaseline =
      "top";


    for (
      let row = 0;
      row < size;
      row++
    ){

      const worldZ =
        minZ
        +
        row;


      if (
        mod(
          worldZ,
          32
        )
        !==
        0
      ){

        continue;
      }


      for (
        let col = 0;
        col < size;
        col++
      ){

        const worldX =
          minX
          +
          col;


        if (
          mod(
            worldX,
            32
          )
          !==
          0
        ){

          continue;
        }


        const chunkX =
          floorDiv(
            worldX,
            32
          );


        const chunkZ =
          floorDiv(
            worldZ,
            32
          );


        const px =
          col *
          cell
          +
          3;


        const py =
          row *
          cell
          +
          3;


        const label =
          chunkX
          +
          ","
          +
          chunkZ;


        ctx.fillStyle =
          "rgba(0,0,0,.52)";


        ctx.fillRect(

          px - 2,

          py - 1,

          ctx.measureText(
            label
          ).width
          +
          5,

          13
        );


        ctx.fillStyle =
          "rgba(225,247,255,.78)";


        ctx.fillText(
          label,
          px,
          py
        );
      }
    }
  }


  ctx.restore();
}


// =====================================================
// CENTER MARKER
// =====================================================

function drawCenterMarker(){

  const cx =
    canvas.width /
    2;


  const cy =
    canvas.height /
    2;


  ctx.save();


  ctx.strokeStyle =
    "rgba(255,255,255,.95)";


  ctx.lineWidth =
    1.5;


  ctx.fillStyle =
    "#ff3344";


  ctx.beginPath();


  ctx.arc(
    cx,
    cy,
    4.5,
    0,
    Math.PI *
    2
  );


  ctx.fill();

  ctx.stroke();


  ctx.restore();
}


// =====================================================
// URL
// =====================================================

function readURL(){

  const p =
    new URLSearchParams(
      location.search
    );


  if (
    p.has(
      "seed"
    )
  ){

    seedEl.value =
      p.get(
        "seed"
      );
  }


  if (
    p.has(
      "x"
    )
  ){

    xEl.value =
      p.get(
        "x"
      );
  }


  if (
    p.has(
      "z"
    )
  ){

    zEl.value =
      p.get(
        "z"
      );
  }


  if (
    p.has(
      "radius"
    )
  ){

    radiusEl.value =
      p.get(
        "radius"
      );
  }
}


function updateURL(
  seed,
  centerX,
  centerZ,
  radius
){

  const p =
    new URLSearchParams();


  p.set(
    "seed",
    seed
  );


  p.set(
    "x",
    centerX
  );


  p.set(
    "z",
    centerZ
  );


  p.set(
    "radius",
    radius
  );


  history.replaceState(
    null,
    "",
    "?"
    +
    p.toString()
  );
}


// =====================================================
// GENERATE WORLD
// =====================================================

async function generate(){

  const seed =
    normalSeed(
      seedEl.value
    );


  const centerX =
    Math.floor(
      Number(
        xEl.value
      )
      ||
      0
    );


  const centerZ =
    Math.floor(
      Number(
        zEl.value
      )
      ||
      0
    );


  const radius =
    clamp(

      Math.floor(
        Number(
          radiusEl.value
        )
        ||
        64
      ),

      8,

      96
    );


  updateURL(
    seed,
    centerX,
    centerZ,
    radius
  );


  statusEl.textContent =
    "CHUNKS LADEN…";


  statusEl.style.color =
    "#ffd166";


  chunks.clear();

  pending.clear();


  createWorker();


  const minX =
    centerX
    -
    radius;


  const maxX =
    centerX
    +
    radius;


  const minZ =
    centerZ
    -
    radius;


  const maxZ =
    centerZ
    +
    radius;


  const minChunkX =
    floorDiv(
      minX,
      CHUNK_SIZE
    );


  const maxChunkX =
    floorDiv(
      maxX,
      CHUNK_SIZE
    );


  const minChunkZ =
    floorDiv(
      minZ,
      CHUNK_SIZE
    );


  const maxChunkZ =
    floorDiv(
      maxZ,
      CHUNK_SIZE
    );


  const requests =
    [];


  for (
    let cx = minChunkX;
    cx <= maxChunkX;
    cx++
  ){

    for (
      let cz = minChunkZ;
      cz <= maxChunkZ;
      cz++
    ){

      for (
        let cy = MIN_CHUNK_Y;
        cy <= MAX_CHUNK_Y;
        cy++
      ){

        requests.push(

          requestChunk(
            seed,
            cx,
            cy,
            cz
          )
        );
      }
    }
  }


  await Promise.all(
    requests
  );


  statusEl.textContent =
    "OBERFLÄCHE…";


  const surface =
    buildSurface(
      seed,
      centerX,
      centerZ,
      radius
    );


  lastSurface =
    surface;


  lastView = {
    seed,
    centerX,
    centerZ,
    radius
  };


  renderSurface(
    surface,
    centerX,
    centerZ,
    radius
  );


  statusEl.textContent =
    "READY ✓  SEED "
    +
    seed;


  statusEl.style.color =
    "#4cff91";
}


// =====================================================
// HOVER
// =====================================================

canvas.addEventListener(

  "mousemove",

  event => {

    if (
      !lastSurface
      ||
      !lastView
    ){

      return;
    }


    const rect =
      canvas.getBoundingClientRect();


    const size =
      lastSurface.length;


    const col =
      clamp(

        Math.floor(

          (
            event.clientX
            -
            rect.left
          )

          /
          rect.width

          *
          size
        ),

        0,

        size - 1
      );


    const row =
      clamp(

        Math.floor(

          (
            event.clientY
            -
            rect.top
          )

          /
          rect.height

          *
          size
        ),

        0,

        size - 1
      );


    const cell =
      lastSurface[row][col];


    const chunkX =
      floorDiv(
        cell.x,
        CHUNK_SIZE
      );


    const chunkZ =
      floorDiv(
        cell.z,
        CHUNK_SIZE
      );


    hoverEl.textContent =

      blockName(
        cell.id
      )

      +
      "  •  X "

      +
      cell.x

      +
      "  Y "

      +
      cell.y

      +
      "  Z "

      +
      cell.z

      +
      "  •  Chunk "

      +
      chunkX

      +
      ", "

      +
      chunkZ;
  }
);


canvas.addEventListener(

  "mouseleave",

  () => {

    hoverEl.textContent =
      "Maus über Karte → Block / Höhe / Chunk";
  }
);


// =====================================================
// EVENTS
// =====================================================

document
  .getElementById(
    "load"
  )
  .onclick =
  generate;


for (
  const el
  of
  [
    seedEl,
    xEl,
    zEl,
    radiusEl
  ]
){

  el.addEventListener(

    "keydown",

    event => {

      if (
        event.key ===
        "Enter"
      ){

        generate();
      }
    }
  );
}


// =====================================================
// START
// =====================================================

async function start(){

  try{

    readURL();


    statusEl.textContent =
      "ENGINE LÄDT…";


    const [
      workerSource,
      blockSource,
      itemSource
    ] =
    await Promise.all([

      loadText(
        "webWorkerBloxd.js"
      ),

      loadText(
        "blockMetadata.js"
      ),

      loadText(
        "itemMetadata.js"
      )

    ]);


    workerFunction =
      extractVariable(
        workerSource,
        "webWorkerCodeFunction"
      );


    bmd =
      extractVariable(
        blockSource,
        "bmd"
      );


    imd =
      extractVariable(
        itemSource,
        "imd"
      );


    buildBlockIndex();


    statusEl.textContent =
      "ENGINE ✓";


    statusEl.style.color =
      "#4cff91";


    await generate();

  }
  catch(
    error
  ){

    console.error(
      error
    );


    statusEl.textContent =
      "FEHLER: "
      +
      error.message;


    statusEl.style.color =
      "#ff5f68";
  }
}


start();

})();
</script>
